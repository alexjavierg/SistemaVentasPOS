version: '3.8'

services:
  api-ventas:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: api-ventas
    restart: unless-stopped
    environment:
      - TZ=America/Lima
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DB_CONNECTION_STRING=server=solufact-db;database=sistemaventas;uid=root;pwd=${DB_PASSWORD};
      - JWT_KEY=${JWT_SECRET}
    networks:
      - solufactcloud_default

  web-ventas:
    build:
      context: .
      dockerfile: Dockerfile.Web
    container_name: web-ventas
    restart: unless-stopped
    environment:
      - TZ=America/Lima
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - DB_CONNECTION_STRING=server=solufact-db;database=sistemaventas;uid=root;pwd=${DB_PASSWORD};
    depends_on:
      - api-ventas
    networks:
      - solufactcloud_default
    volumes:
      - web_uploads:/app/wwwroot/uploads
      - web_keys:/root/.aspnet/DataProtection-Keys

networks:
  solufactcloud_default:
    external: true

volumes:
  web_uploads:
  web_keys:







